[project]
name = 'lyra-overlays'
version = '0.1'
description = 'build and install device tree overlays on Luckfox Lyra boards'
readme = 'README.md'
authors = [
    {name = 'Aaron Griffith', email = 'aargri@gmail.com'},
]

# this is the new format, supported on Debian 13 (trixie)
# but not on Ubuntu 24.04 (noble), which is the GitHub builder
#license = 'GPL-3.0-or-later'
#license-files = ['COPYING.md']

# old format
license = {file = 'COPYING.md'}

urls.Source = 'https://github.com/agrif/debian-lyra'

keywords = ['lyra', 'device-tree', 'overlay']
classifiers = [
    'Development Status :: 4 - Beta',
    'Programming Language :: Python :: 3',
    'Environment :: Console',
    'Operating System :: POSIX :: Linux',
    'Topic :: Software Development :: Embedded Systems',
    'Topic :: System :: Hardware',
]

requires-python = '>= 3.13'
dependencies = [
    'pylibfdt >= 1.7.0',
    'kconfiglib >= 14.1.0',
]

[project.scripts]
lyra-overlays = 'lyra_overlays.cli:main'

[build-system]
requires = ['setuptools >= 77.0.3']
build-backend = 'setuptools.build_meta'
